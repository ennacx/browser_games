<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <title>Number Merge</title>

    <meta name="description" content="同じ数字を集めて大きく育てる、シンプルな数字パズル">
    <meta name="theme-color" content="#f7f3ee">

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Number Merge">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <div class="top-row">
            <div>
                <a href="../../index.html" class="back-link" aria-label="ゲーム一覧に戻る">←&nbsp;一覧</a>
                <h1>Number<span>Merge</span></h1>
                <div class="subtitle">同じ数字を集めて、大きく育てよう</div>
            </div>
            <div class="scores">
                <div class="score-box">
                    <div class="label">Score</div>
                    <div id="score" class="value">0</div>
                </div>
                <div class="score-box">
                    <div class="label">Time</div>
                    <div id="time" class="value">0:00</div>
                </div>
                <div class="score-box">
                    <div class="label">Best</div>
                    <div id="best" class="value">0</div>
                </div>
            </div>
        </div>

        <div class="board-wrap">
            <div id="board" class="board" role="group" aria-label="パズルボード">
                <div id="overlay" class="overlay">
                    <div id="overlay-msg" class="msg">Game Over</div>
                    <div id="overlay-sub" class="sub">これ以上動かせません</div>
                    <button type="button" id="continue" class="continue">つづける</button>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="hint">矢印キー&nbsp;/&nbsp;スワイプで操作</div>
            <div class="button-groups">
                <div class="history-buttons">
                    <button type="button" id="undo" class="history-button" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-counterclockwise" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M8 3a5 5 0 1 1-4.546 2.914.5.5 0 0 0-.908-.417A6 6 0 1 0 8 2z"/>
                            <path d="M8 4.466V.534a.25.25 0 0 0-.41-.192L5.23 2.308a.25.25 0 0 0 0 .384l2.36 1.966A.25.25 0 0 0 8 4.466"/>
                        </svg>
                    </button>
                    <button type="button" id="redo" class="history-button" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-clockwise" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/>
                            <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/>
                        </svg>
                    </button>
                </div>

                <button type="button" id="reset" class="reset">はじめから</button>
            </div>
        </div>
    </div>

    <!-- サイト共通のサービスワーカー登録(ルートのsw.jsを1つだけ登録する) -->
    <script src="../../shared/register-sw.js"></script>
    <script src="script.js"></script>
</body>
</html>
